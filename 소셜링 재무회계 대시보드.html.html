<!DOCTYPE html>
<!--
  재무회계 대시보드 — 파일 하나로 동작하는 index.html
  · 설정(구글시트 주소, 비밀번호)은 아래에서 Ctrl+F로 'CFG' 를 찾아 수정합니다.
  · 맨 아래 window.EMBED 는 저장된 데이터이므로 건드리지 않습니다.
-->

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>재무 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#16202b;--ink2:#52606e;--mute:#8793a0;--line:#dde3ea;--accent:#2b6cb0;--s:#2b6cb0;--b:#1d8a7a;--in:#2b6cb0;--out:#c4512f;--bar:#4b6f95;--warn:#b7791f;--ok:#2f855a;--bad:#c53030;--shadow:0 1px 2px rgba(20,30,40,.05);--sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#18212a;--ink:#e6ebf0;--ink2:#a5b1bd;--mute:#74818e;--line:#2a3541;--accent:#6aa6e6;--s:#6aa6e6;--b:#4fc3b0;--in:#6aa6e6;--out:#ef8a69;--bar:#7fa3c9;--warn:#e0a84a;--ok:#5fc08a;--bad:#f07d7d;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.sub{color:var(--ink2);font-size:12.5px;font-weight:400}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px}
.btn,select,.tabs button{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.ghost{color:var(--ink2)}
.btn:focus-visible,select:focus-visible,.tabs button:focus-visible,input:focus-visible,.gate-box button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sources{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
.chip.live{color:var(--ok);border-color:var(--ok)}
.chip.file{color:var(--warn);border-color:var(--warn)}
.chip.none{color:var(--mute)}
.chip.err{color:var(--bad);border-color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel-head h2{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid2.inner{gap:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card .l{font-size:12px;color:var(--ink2)}
.card .v{font-size:18px;font-weight:500;margin-top:2px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.card .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.neg{color:var(--out)}
.chartbox{position:relative;height:290px}
.chartbox.tall{height:330px}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.memo{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.memo .d{color:var(--mute);font-size:12px}
.memo.empty{list-style:none;padding:0;color:var(--mute);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink2);font-size:12px;text-align:left;border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
tr.tot td{font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(100px,34%) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.track{height:10px;background:var(--bg);border-radius:2px;overflow:hidden}
.fill{display:block;height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.pc{color:var(--mute);font-size:11.5px;margin-left:6px}
.empty-box{padding:22px 8px;text-align:center;color:var(--mute);font-size:13px;border:1px dashed var(--line);border-radius:8px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid;height:fit-content;white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.foot{color:var(--mute);font-size:12px;text-align:center}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.gate-box p{margin:0;color:var(--ink2);font-size:13px}
.gate-box input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.gate-box button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.gate-msg{color:var(--bad);font-size:12.5px;min-height:18px}
@media (max-width:520px){.chartbox{height:250px}.card .v{font-size:17px}h1{font-size:19px}}

</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="gate" class="gate">
  <form id="gateForm" class="gate-box" autocomplete="off">
    <h1>재무 대시보드</h1>
    <p>내부용 페이지입니다. 비밀번호를 입력해 주세요.</p>
    <label for="pw" class="sr">비밀번호</label>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button type="submit">들어가기</button>
    <div id="gateMsg" class="gate-msg" role="alert"></div>
  </form>
</div>

<!-- 대시보드 -->
<main id="app" class="wrap" hidden>
  <header class="top">
    <div>
      <h1>재무회계 대시보드</h1>
      <div class="sub">소셜링 · 바디코 <span id="asof"></span></div>
    </div>
    <div class="top-actions">
      <button id="refresh" type="button" class="btn">새로고침</button>
      <button id="logout" type="button" class="btn ghost">잠그기</button>
    </div>
  </header>
  <div id="sources" class="sources" aria-label="데이터 연결 상태"></div>

  <section class="grid2" aria-label="이슈와 예정사항">
    <div class="panel"><h2>이슈사항</h2><ul id="issues" class="memo"></ul></div>
    <div class="panel"><h2>예정사항</h2><ul id="plans" class="memo"></ul></div>
  </section>

  <section id="cards" class="cards" aria-label="핵심 지표"></section>

  <section class="grid2">
    <div class="panel"><h2>월별 총매출</h2><div id="salesNote" class="note"></div><div class="chartbox"><canvas id="cSales"></canvas></div></div>
    <div class="panel"><h2>누적 매출</h2><div id="cumNote" class="note"></div><div class="chartbox"><canvas id="cCum"></canvas></div></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>일자별 잔고 추이</h2>
      <select id="balRange" aria-label="잔고 추이 기간"><option value="90">최근 90일 + 예정</option><option value="30">최근 30일 + 예정</option><option value="all">전체</option></select></div>
    <div class="legend" id="balLegend"></div>
    <div class="chartbox tall"><canvas id="cBal"></canvas></div>
    <div class="note">점선 구간은 오늘 이후의 예상 잔고입니다(입금 예정은 반영되지 않음).</div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>소셜링 · 바디코 입금 vs 지출 (기간합계)</h2>
      <select id="period" aria-label="기간 선택"></select></div>
    <div class="grid2 inner">
      <div class="chartbox"><canvas id="cFlow"></canvas></div>
      <div class="scroll"><table id="flowTable"></table><div class="note" id="flowNote"></div></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>지출 구성</h2>
      <div class="tabs" id="expTabs" role="group" aria-label="사업장 선택"><button type="button" data-k="s" aria-pressed="true">소셜링</button><button type="button" data-k="b" aria-pressed="false">바디코</button></div></div>
    <div id="expBody"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>손익현황 <span class="sub" id="plUnit">(위하고 월별 손익)</span></h2>
      <div class="tabs" id="plTabs" role="group" aria-label="사업장 선택"><button type="button" data-k="s" aria-pressed="true">소셜링</button><button type="button" data-k="b" aria-pressed="false">바디코</button></div></div>
    <div id="plBody"></div>
  </section>

  <section class="panel">
    <h2>데이터 점검</h2>
    <ul id="checks" class="checks"></ul>
  </section>
  <footer class="foot">금액 단위는 원이며, 차트는 백만원 단위입니다.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* parse.js — CSV 읽기와 계산만 담당합니다. (화면 코드는 app.js)
   브라우저와 Node.js 양쪽에서 같은 코드로 동작해서 계산 결과를 테스트할 수 있습니다. */
(function (root) {
  'use strict';

  /* ── 한글 인코딩: UTF-8을 먼저 시도하고, 깨지면 EUC-KR(위하고 CSV 등)로 읽습니다 ── */
  function decodeBuffer(buf) {
    const u8 = new Uint8Array(buf);
    try { return new TextDecoder('utf-8', { fatal: true }).decode(u8).replace(/^﻿/, ''); }
    catch (e) { return new TextDecoder('euc-kr').decode(u8); }
  }

  /* ── CSV → 2차원 배열 (따옴표 안의 쉼표·줄바꿈 처리) ── */
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch !== '\r') cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  /* ── 숫자·날짜 ── */
  function numOrNull(s) {
    s = String(s == null ? '' : s).trim();
    if (!/\d/.test(s)) return null;
    const neg = /^\(.*\)$/.test(s) || s[0] === '-';
    const n = parseFloat(s.replace(/[^\d.]/g, ''));
    return isNaN(n) ? null : (neg ? -n : n);
  }
  const num = (s) => { const n = numOrNull(s); return n === null ? 0 : n; };
  function parseDate(s) {            // '2026. 4. 1' / '2026-07-29' / '2026/7/1' → '2026-04-01'
    const m = String(s == null ? '' : s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return m ? m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0') : null;
  }

  /* ── ① 일자별 잔고 파일 (일자 병합 셀, 입금/지출/잔고 3줄 구조) ── */
  function parseBalance(rows) {
    const h = rows.findIndex(r => r.some(c => c.trim() === '일자') && r.some(c => c.trim() === '구분'));
    if (h < 0) throw new Error('머리글 줄(일자, 구분)을 찾지 못했습니다');
    const H = rows[h].map(c => c.trim());
    const ci = H.indexOf('일자'), ck = H.indexOf('구분');
    const cs = H.findIndex(c => c.includes('소셜링')), cb = H.findIndex(c => c.includes('바디코'));
    const ct = H.findIndex(c => c === '합계');
    if (cs < 0 || cb < 0) throw new Error('소셜링/바디코 열을 찾지 못했습니다');
    const map = new Map(); let cur = null;
    for (const r of rows.slice(h + 1)) {
      const d = parseDate(r[ci]); if (d) cur = d;          // 병합 셀: 빈 칸은 위 날짜를 이어 씀
      const k = (r[ck] || '').trim();
      if (!cur || !['입금', '지출', '잔고'].includes(k)) continue;
      if (!map.has(cur)) map.set(cur, { d: cur });
      const s = num(r[cs]), b = num(r[cb]);
      map.get(cur)[k] = { s, b, t: ct >= 0 ? num(r[ct]) : s + b };
    }
    const zero = { s: 0, b: 0, t: 0 };       // 시작일(3/31)처럼 잔고 줄만 있는 날은 입금·지출을 0으로 봅니다
    const days = [...map.values()].filter(x => x.잔고).sort((a, b) => a.d < b.d ? -1 : 1)
      .map(x => ({ d: x.d, in: x.입금 || zero, out: x.지출 || zero, bal: x.잔고 }));
    if (!days.length) throw new Error('일자별 데이터가 비어 있습니다');
    return days;
  }
  function checkBalance(days) {       // 합계=소셜링+바디코, 전일잔고+입금-지출=잔고
    const sumBad = [], brk = { s: [], b: [] };
    days.forEach((x, i) => {
      if (Math.abs(x.bal.s + x.bal.b - x.bal.t) > 1) sumBad.push(x.d);
      if (i === 0) return;
      const p = days[i - 1];
      ['s', 'b'].forEach(k => { if (Math.abs(p.bal[k] + x.in[k] - x.out[k] - x.bal[k]) > 1) brk[k].push({ d: x.d, diff: x.bal[k] - (p.bal[k] + x.in[k] - x.out[k]) }); });
    });
    return { sumBad, brk };
  }

  /* ── ② 자금예상 거래내역 (입금/지출 두 덩어리, 날짜 형식 혼재, 합계 줄 포함) ──
     열 순서: 0 날짜 · 1 입출금 · 2 실행 · 3 비용구분 · 4 업체명 · 5 내용 · 6 금액 */
  function parseLedger(rows) {
    const out = [];
    for (const r of rows) {
      const d = parseDate(r[0]); const t = (r[1] || '').trim();
      if (!d || (t !== '입금' && t !== '지출')) continue;
      const amt = numOrNull(r[6]); if (amt === null) continue;       // '변동' 처럼 숫자가 없는 줄은 제외
      const rec = { d, t, cat: (r[3] || '').trim(), vendor: (r[4] || '').trim(), memo: (r[5] || '').trim(), amt };
      const c = classify(rec); rec.g = c[0]; rec.c = c[1];
      out.push(rec);
    }
    return out;
  }
  function classify(r) {       // [그룹(영업/재무), 분류]
    const key = [r.cat, r.vendor, r.memo].join(' '), cat = r.cat + r.vendor + r.memo, a = r.amt;
    if (r.t === '입금') {
      if (/대출|대여금상환|계좌해제|mmt/i.test(cat) && a >= 1e7) return ['재무', '대출·대여금·계좌이동'];
      if (/Npay|tosspay|toss|카카오페이/i.test(key)) return ['영업', '플랫폼 정산(Npay·토스·카카오페이)'];
      if (/고용노동부|지원금|정부|유산정책|세무서/.test(key)) return ['영업', '정부지원·환급'];
      if (/이자/.test(key)) return ['영업', '이자수익'];
      if (r.cat === '' && r.vendor && a <= 60000 && !/세무|이자/.test(key)) return ['영업', '소액 개인결제'];
      return ['영업', '매출(광고·운영비 등)'];
    }
    if (/주식|증권|계좌대체|해외주식|주식계좌/.test(key)) return ['재무', '주식·계좌 이동'];
    if (/대출|상환|원금|이자/.test(key)) return ['재무', '대출 원금·이자'];
    if (/대여금/.test(key)) return ['재무', '대여금'];
    if (/급여|상여|퇴직|인건비|사업소득|외주급여/.test(key)) return ['영업', '인건비'];
    if (/4대보험|사대보험|건강보험|연금보험|고용보험|국민연금|국민건강/.test(key)) return ['영업', '4대보험'];
    if (/부가세|세금과공과|국세|지방세|세금|인지세|재산세|원천세/.test(key)) return ['영업', '세금·부가세'];
    if (/카드/.test(key)) return ['영업', '법인카드 대금'];
    if (/광고 협업|크리에이터|외주|촬영|편집|정산|시딩|협업/.test(key)) return ['영업', '크리에이터·외주 정산'];
    if (/광고|비즈머니|마케팅|바이럴|퍼포먼스|정기결제/.test(key)) return ['영업', '광고·마케팅'];
    if (/임차|보험|라이프|통신|렌탈|렌터|리스|KT|lgu|고정|수수료|관리비|렌트|보증료/i.test(key)) return ['영업', '고정비·수수료'];
    return ['영업', '기타 지출'];
  }

  /* ── ③ 위하고 기간별 손익계산서(월별) — 머리글: 과목 / 합계 / 2026년01월 … ──

<script>

/* ── 차트 공통 ── */

}

function drawSales() {
  const pls = plCompanies();
  if (!pls.length) { ['cSales', 'cCum'].forEach(id => emptyBox(id, '손익 데이터가 연결되지 않았습니다')); $('salesNote').textContent = ''; $('cumNote').textContent = ''; return; }

  const months = [...new Set(pls.flatMap(c => c[2].months))].sort();

  const colors = { s: css('--s'), b: css('--b') };
  const labels = months.map(m => (m.slice(5) * 1) + '월');

  if (pls.length > 1) { let a = 0; ds.push({ label: '합계 누적', data: months.map((m, i) => (a += sum(pls, c => val(c, i)), M(a))), borderColor: css('--ink'), backgroundColor: css('--ink'), borderWidth: 2.5, pointRadius: 3, tension: 0 }); }
  mk('cCum', { type: 'line', data: { labels, datasets: ds }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: css('--ink2'), boxWidth: 10 } }, tooltip: tipM }, scales: axisOpts() } });
  const note = pls.length < 2 ? '바디코 매출 데이터가 연결되지 않아 소셜링만 표시합니다.' : '';
  $('salesNote').textContent = note; $('cumNote').textContent = note;
}

function drawBalance() {
  const B = ST.data.balance;
  if (!B) { emptyBox('cBal', '잔고 데이터가 연결되지 않았습니다'); $('balLegend').innerHTML = ''; return; }
  ensureCanvas('cBal');
  const r = $('balRange').value; let days = B;
  if (r !== 'all') { const t = new Date(TODAY + 'T00:00:00'); t.setDate(t.getDate() - +r); const from = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); days = B.filter(x => x.d >= from); }
  const fi = days.findIndex(x => x.d > TODAY);
  const dash = { borderDash: ctx => (fi >= 0 && ctx.p1DataIndex >= fi) ? [6, 4] : undefined };
  const line = (label, k, color, w) => ({ label, data: days.map(x => M(x.bal[k])), borderColor: color, backgroundColor: color, borderWidth: w, pointRadius: 0, pointHoverRadius: 4, tension: 0, segment: dash });
  const cs = css('--s'), cb = css('--b'), ci = css('--ink');
  $('balLegend').innerHTML = [['소셜링', cs], ['바디코', cb], ['합계', ci]].map(([n, c]) => '<span><i style="background:' + c + '"></i>' + n + '</span>').join('');
  mk('cBal', { type: 'line', data: { labels: days.map(x => md(x.d)), datasets: [line('소셜링', 's', cs, 2), line('바디코', 'b', cb, 2), line('합계', 't', ci, 2.5)] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: tipM }, scales: axisOpts() } });
}

function fillPeriods() {
  const B = ST.data.balance, sel = $('period'); if (!B) { sel.innerHTML = ''; return; }
  const ms = [...new Set(B.filter(x => x.d <= TODAY && (x.in.t || x.out.t)).map(x => x.d.slice(0, 7)))].sort();
  const cur = ST.period, opts = [['all', '전체 (' + (ms[0] ? ms[0].slice(5) * 1 : '') + '~' + (ms.at(-1) ? ms.at(-1).slice(5) * 1 : '') + '월)']].concat(ms.map(m => [m, (m.slice(5) * 1) + '월']));
  sel.innerHTML = opts.map(o => '<option value="' + o[0] + '">' + o[1] + '</option>').join('');
  sel.value = opts.some(o => o[0] === cur) ? cur : 'all'; ST.period = sel.value;
}
const inPeriod = d => d <= TODAY && (ST.period === 'all' || d.slice(0, 7) === ST.period);

function drawFlow() {
  const B = ST.data.balance, tb = $('flowTable');
  if (!B) { emptyBox('cFlow', '잔고 데이터가 연결되지 않았습니다'); tb.innerHTML = ''; $('flowNote').textContent = ''; return; }
  ensureCanvas('cFlow');
  const D = B.filter(x => x.d > B[0].d && inPeriod(x.d));
  const v = { s: { i: sum(D, x => x.in.s), o: sum(D, x => x.out.s) }, b: { i: sum(D, x => x.in.b), o: sum(D, x => x.out.b) } };
  mk('cFlow', { type: 'bar', data: { labels: ['소셜링', '바디코'], datasets: [{ label: '입금', data: [M(v.s.i), M(v.b.i)], backgroundColor: css('--in'), maxBarThickness: 46 }, { label: '지출', data: [M(v.s.o), M(v.b.o)], backgroundColor: css('--out'), maxBarThickness: 46 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: css('--ink2'), boxWidth: 10 } }, tooltip: tipM }, scales: axisOpts() } });
  const row = (n, i, o, cls) => '<tr class="' + (cls || '') + '"><td>' + n + '</td><td class="r num">' + f(i) + '</td><td class="r num">' + f(o) + '</td><td class="r num ' + (i - o < 0 ? 'neg' : '') + '">' + f(i - o) + '</td></tr>';
  tb.innerHTML = '<tr><th>사업장</th><th class="r">입금</th><th class="r">지출</th><th class="r">순흐름</th></tr>' + row('소셜링', v.s.i, v.s.o) + row('바디코', v.b.i, v.b.o) + row('합계', v.s.i + v.b.i, v.s.o + v.b.o, 'tot');
  let note = '대출 입출금과 주식계좌 이체 같은 자금 이동도 포함된 금액입니다.';
  const L = ST.data.ledgerS;
  if (L) { const R = L.filter(r => inPeriod(r.d) && r.g === '영업'); note += ' 소셜링 자금 이동을 뺀 영업 기준은 입금 ' + f(sum(R.filter(r => r.t === '입금'), r => r.amt)) + ' · 지출 ' + f(sum(R.filter(r => r.t === '지출'), r => r.amt)) + '입니다.'; }
  $('flowNote').textContent = note;
}

function drawExp() {
  const k = ST.exp, body = $('expBody'), L = ST.data[k === 's' ? 'ledgerS' : 'ledgerB'], name = k === 's' ? '소셜링' : '바디코';
  if (!L) { body.innerHTML = '<div class="empty-box">' + name + ' 거래내역이 연결되지 않았습니다</div>'; return; }
  const R = L.filter(r => r.t === '지출' && inPeriod(r.d)), op = R.filter(r => r.g === '영업'), fin = R.filter(r => r.g === '재무');
  const grp = a => { const m = {}; a.forEach(r => m[r.c] = (m[r.c] || 0) + r.amt); return Object.entries(m).sort((x, y) => y[1] - x[1]); };
  const tot = sum(op, r => r.amt), mx = Math.max(1, ...grp(op).map(x => x[1]));
  const fut = L.filter(r => r.t === '지출' && r.d > TODAY);
  let h = '<div class="note" style="margin:0 0 8px">영업 지출 합계 <b class="num">' + f(tot) + '</b>원 (대출 원금·이자, 주식계좌 이동 제외)</div>';
  h += op.length ? grp(op).map(([n, a]) => '<div class="row"><span class="nm" title="' + esc(n) + '">' + esc(n) + '</span><span class="track"><span class="fill" style="width:' + (a / mx * 100).toFixed(1) + '%"></span></span><span class="num">' + f(a) + '<span class="pc">' + (a / tot * 100).toFixed(0) + '%</span></span></div>').join('') : '<div class="empty-box">해당 기간 지출 내역이 없습니다</div>';
  if (fin.length) h += '<div class="note" style="margin-top:12px">제외한 자금 이동: ' + grp(fin).map(([n, a]) => esc(n) + ' ' + f(a)).join(' · ') + '</div>';
  if (fut.length) h += '<div class="note">오늘 이후 예정 지출: ' + fut.length + '건 ' + f(sum(fut, r => r.amt)) + '원 (기간 합계에는 포함하지 않음)</div>';
  body.innerHTML = h;
}

function drawPL() {
  const k = ST.pl, body = $('plBody'), p = ST.data[k === 's' ? 'plS' : 'plB'], name = k === 's' ? '소셜링' : '바디코';
  if (!p) { if (ST.charts.cPL) { ST.charts.cPL.destroy(); delete ST.charts.cPL; } body.innerHTML = '<div class="empty-box">' + name + ' 손익 데이터가 연결되지 않았습니다</div>'; return; }
  body.innerHTML = '<div class="chartbox"><canvas id="cPL"></canvas></div><div class="scroll" style="margin-top:12px"><table id="plTable"></table></div><div class="note">영업이익 = 매출액 − 매출원가 − 판관비, 당기순이익 = 영업이익 + 영업외수익 − 영업외비용 − 법인세. 원본 파일의 해당 줄과 대조했습니다(아래 데이터 점검).</div>';
  const labels = p.months.map(m => (m.slice(5) * 1) + '월');
  mk('cPL', { data: { labels, datasets: [
    { type: 'bar', label: '매출액', data: p.sales.map(M), backgroundColor: css(k === 's' ? '--s' : '--b'), maxBarThickness: 30 },
    { type: 'bar', label: '판관비', data: p.sga.map(M), backgroundColor: css('--out'), maxBarThickness: 30 },
    { type: 'line', label: '영업이익', data: p.op.map(M), borderColor: css('--ink'), backgroundColor: css('--ink'), borderWidth: 2.5, pointRadius: 3, tension: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { labels: { color: css('--ink2'), boxWidth: 10 } }, tooltip: tipM }, scales: axisOpts() } });
  const cell = v => '<td class="r num ' + (v < 0 ? 'neg' : '') + '">' + f(v) + '</td>';
  let t = '<tr><th>월</th><th class="r">매출액</th><th class="r">판관비</th><th class="r">영업이익</th><th class="r">당기순이익</th></tr>';
  p.months.forEach((m, i) => t += '<tr><td>' + (m.slice(5) * 1) + '월</td>' + cell(p.sales[i]) + cell(p.sga[i]) + cell(p.op[i]) + cell(p.net[i]) + '</tr>');
  t += '<tr class="tot"><td>합계</td>' + cell(sum(p.sales)) + cell(sum(p.sga)) + cell(sum(p.op)) + cell(sum(p.net)) + '</tr>';
  $('plTable').innerHTML = t;
}

function drawChecks() {
  const out = [], add = (ok, text) => out.push('<li><span class="badge ' + (ok ? 'ok' : 'warn') + '">' + (ok ? '정상' : '확인 필요') + '</span><span>' + text + '</span></li>');
  const B = ST.data.balance;
  if (B) {
    const ck = P.checkBalance(B);
    add(!ck.sumBad.length, '잔고 합계 = 소셜링 + 바디코 (' + B.length + '일 · ' + md(B[0].d) + '~' + md(B.at(-1).d) + ')' + (ck.sumBad.length ? ' — 어긋난 날짜 ' + ck.sumBad.map(md).join(', ') : ''));
    [['s', '소셜링'], ['b', '바디코']].forEach(([k, n]) => add(!ck.brk[k].length, n + ' 잔고 연속성 (전일잔고 + 입금 − 지출 = 잔고)' + (ck.brk[k].length ? ' — ' + ck.brk[k].map(x => md(x.d) + ' ' + (x.diff > 0 ? '+' : '') + f(x.diff) + '원').join(', ') : '')));
    const L = ST.data.ledgerS;
    if (L) {
      const bi = sum(B.filter(x => x.d <= TODAY), x => x.in.s), bo = sum(B.filter(x => x.d <= TODAY), x => x.out.s);
      const li = sum(L.filter(r => r.t === '입금' && r.d <= TODAY), r => r.amt), lo = sum(L.filter(r => r.t === '지출' && r.d <= TODAY), r => r.amt);
      add(Math.abs(bi - li) < 1, '소셜링 입금: 잔고 파일 ' + f(bi) + ' vs 거래내역 ' + f(li) + (Math.abs(bi - li) < 1 ? ' (일치)' : ' (차이 ' + f(bi - li) + ')'));
      add(Math.abs(bo - lo) < 1, '소셜링 지출: 잔고 파일 ' + f(bo) + ' vs 거래내역 ' + f(lo) + (Math.abs(bo - lo) < 1 ? ' (일치)' : ' (차이 ' + f(bo - lo) + ')'));
      const bf = sum(B.filter(x => x.d > TODAY), x => x.out.s), lf = sum(L.filter(r => r.t === '지출' && r.d > TODAY), r => r.amt);
      add(Math.abs(bf - lf) < 1, '소셜링 예정 지출: 잔고 파일 ' + f(bf) + ' vs 거래내역 ' + f(lf) + (Math.abs(bf - lf) < 1 ? ' (일치)' : ' (차이 ' + f(bf - lf) + ')'));
    }
  } else add(false, '잔고 데이터가 없어 잔고 점검을 하지 못했습니다');
  [['plS', '소셜링'], ['plB', '바디코']].forEach(([k, n]) => { const p = ST.data[k]; if (!p) return;
    add(p.chk.sumOk, n + ' 손익: 월별 매출 합 = 원본 합계 열 (' + f(sum(p.sales)) + ')');
    add(p.chk.opOk && p.chk.netOk, n + ' 손익: 계산한 영업이익·당기순이익이 원본과 일치' + (p.chk.opOk && p.chk.netOk ? '' : ' — 불일치')); });
  $('checks').innerHTML = out.join('');
}
